<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUSPI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes word-appear { 
            0% { opacity: 0; transform: translateY(30px) scale(0.8); filter: blur(10px); } 
            50% { opacity: 0.8; transform: translateY(10px) scale(0.95); filter: blur(2px); } 
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } 
        }
        @keyframes grid-draw { 
            0% { stroke-dashoffset: 1000; opacity: 0; } 
            50% { opacity: 0.3; } 
            100% { stroke-dashoffset: 0; opacity: 0.15; } 
        }
        @keyframes pulse-glow { 
            0%, 100% { opacity: 0.2; transform: scale(1); } 
            50% { opacity: 0.6; transform: scale(1.15); } 
        }
        .word-animate { 
            display: inline-block; 
            opacity: 0; 
            margin: 0 0.1em; 
            transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease; 
        }
        .word-animate:hover { 
            color: #818cf8; 
            transform: translateY(-2px); 
            text-shadow: 0 0 25px rgba(129, 140, 248, 0.8);
        }
        .grid-line { 
            stroke: #6366f1; 
            stroke-width: 0.5; 
            opacity: 0; 
            stroke-dasharray: 6 6; 
            stroke-dashoffset: 1000; 
            animation: grid-draw 2.5s ease-out forwards; 
        }
        .detail-dot { 
            fill: #38bdf8; 
            opacity: 0; 
            animation: pulse-glow 3s ease-in-out infinite; 
        }
        .corner-element-animate { 
            position: absolute; 
            width: 40px; 
            height: 40px; 
            border: 1px solid rgba(99, 102, 241, 0.25); 
            opacity: 0; 
            animation: word-appear 1s ease-out forwards; 
        }
        .text-decoration-animate { position: relative; }
        .text-decoration-animate::after { 
            content: ''; 
            position: absolute; 
            bottom: -8px; 
            left: 0; 
            width: 0; 
            height: 1px; 
            background: linear-gradient(90deg, transparent, #818cf8, #38bdf8, transparent); 
            animation: underline-grow 2s ease-out forwards; 
            animation-delay: 2.2s; 
        }
        @keyframes underline-grow { to { width: 100%; } }
        .floating-element-animate { 
            position: absolute; 
            width: 2px; 
            height: 2px; 
            background: #38bdf8; 
            border-radius: 50%; 
            opacity: 0; 
            animation: float 4s ease-in-out infinite; 
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; } 
            25% { transform: translateY(-12px) translateX(6px); opacity: 0.7; } 
            50% { transform: translateY(-6px) translateX(-4px); opacity: 0.4; } 
            75% { transform: translateY(-18px) translateX(8px); opacity: 0.9; } 
        }
        #mouse-gradient-auspi {
            position: fixed;
            pointer-events: none;
            border-radius: 9999px;
            background-image: radial-gradient(circle, rgba(99, 102, 241, 0.15), rgba(56, 189, 248, 0.08), transparent 70%);
            transform: translate(-50%, -50%);
            will-change: left, top, opacity;
            transition: left 70ms linear, top 70ms linear, opacity 300ms ease-out;
            opacity: 0;
            z-index: 1;
        }
        .ripple-effect { 
            position: fixed; 
            width: 6px; 
            height: 6px; 
            background: rgba(56, 189, 248, 0.5); 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            animation: pulse-glow 1s ease-out forwards; 
            z-index: 9999; 
        }
    </style>
    <!-- Browser Tab Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
<link rel="shortcut icon" href="/favicon.png" />

<!-- Mobile / Apple Touch App Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

<!-- Mobile Browser Header & PWA Config -->
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-title" content="AUSPI" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.json" />
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 font-sans overflow-hidden relative selection:bg-indigo-500 selection:text-white">

    <!-- Dynamic Vector Spatial Grid Background -->
    <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <pattern id="gridAuspiSpatial" width="60" height="60" patternUnits="userSpaceOnUse">
                <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="0.5" />
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#gridAuspiSpatial)" />
        <line x1="0" y1="20%" x2="100%" y2="20%" class="grid-line" style="animation-delay: 0.5s;" />
        <line x1="0" y1="80%" x2="100%" y2="80%" class="grid-line" style="animation-delay: 1s;" />
        <line x1="20%" y1="0" x2="20%" y2="100%" class="grid-line" style="animation-delay: 1.5s;" />
        <line x1="80%" y1="0" x2="80%" y2="100%" class="grid-line" style="animation-delay: 2s;" />
        <line x1="50%" y1="0" x2="50%" y2="100%" class="grid-line" style="animation-delay: 2.5s; opacity: 0.04;" />
        <line x1="0" y1="50%" x2="100%" y2="50%" class="grid-line" style="animation-delay: 3s; opacity: 0.04;" />
        
        <circle cx="20%" cy="20%" r="2" class="detail-dot" style="animation-delay: 3s;" />
        <circle cx="80%" cy="20%" r="2" class="detail-dot" style="animation-delay: 3.2s;" />
        <circle cx="20%" cy="80%" r="2" class="detail-dot" style="animation-delay: 3.4s;" />
        <circle cx="80%" cy="80%" r="2" class="detail-dot" style="animation-delay: 3.6s;" />
        <circle cx="50%" cy="50%" r="2" class="detail-dot" style="animation-delay: 4s;" />
    </svg>

    <!-- Corner Accents -->
    <div class="corner-element-animate top-4 left-4 sm:top-6 sm:left-6 md:top-8 md:left-8" style="animation-delay: 3.8s;">
        <div class="absolute top-0 left-0 w-2 h-2 bg-indigo-400 opacity-40 rounded-full"></div>
    </div>
    <div class="corner-element-animate top-4 right-4 sm:top-6 sm:right-6 md:top-8 md:right-8" style="animation-delay: 4.0s;">
        <div class="absolute top-0 right-0 w-2 h-2 bg-sky-400 opacity-40 rounded-full"></div>
    </div>
    <div class="corner-element-animate bottom-4 left-4 sm:bottom-6 sm:left-6 md:bottom-8 md:left-8" style="animation-delay: 4.2s;">
        <div class="absolute bottom-0 left-0 w-2 h-2 bg-rose-400 opacity-40 rounded-full"></div>
    </div>
    <div class="corner-element-animate bottom-4 right-4 sm:bottom-6 sm:right-6 md:bottom-8 md:right-8" style="animation-delay: 4.4s;">
        <div class="absolute bottom-0 right-0 w-2 h-2 bg-emerald-400 opacity-40 rounded-full"></div>
    </div>

    <!-- Floating Background Particles -->
    <div class="floating-element-animate" style="top: 25%; left: 15%; animation-delay: 0.5s;"></div>
    <div class="floating-element-animate" style="top: 60%; left: 85%; animation-delay: 1s;"></div>
    <div class="floating-element-animate" style="top: 40%; left: 10%; animation-delay: 1.5s;"></div>
    <div class="floating-element-animate" style="top: 75%; left: 90%; animation-delay: 2s;"></div>

    <!-- Glowing Mouse Cursor Follower -->
    <div id="mouse-gradient-auspi" class="w-72 h-72 blur-2xl sm:w-96 sm:h-96 sm:blur-3xl md:w-[28rem] md:h-[28rem]"></div>

    <!-- Main Container -->
    <div class="relative z-10 min-h-screen flex flex-col justify-between items-center px-6 py-10 sm:px-8 sm:py-12 md:px-16 md:py-16">
        
        <!-- Header Subtitle -->
        <div class="text-center">
            <h2 class="text-xs sm:text-sm font-mono font-light text-sky-400 uppercase tracking-[0.25em] opacity-90">
                <span class="word-animate" data-delay="0">Autonomous</span>
                <span class="word-animate" data-delay="150">Urban</span>
                <span class="word-animate" data-delay="300">Spatial</span>
                <span class="word-animate" data-delay="450">Intelligence</span>
            </h2>
            <div class="mt-4 w-16 sm:w-24 h-px bg-gradient-to-r from-transparent via-indigo-400 to-transparent opacity-40 mx-auto"></div>
        </div>

        <!-- Central Hero Headline -->
        <div class="text-center max-w-5xl mx-auto relative my-auto">
            <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-extralight leading-tight tracking-tight text-slate-50 text-decoration-animate">
                <div class="mb-4 md:mb-6">
                    <span class="word-animate" data-delay="700">AUSPI</span>
                    <span class="word-animate" data-delay="850">Architects</span>
                    <span class="word-animate" data-delay="1000">Smarter</span>
                    <span class="word-animate text-indigo-400 font-normal" data-delay="1150">Cities.</span>
                </div>
                
                <div class="text-lg sm:text-2xl md:text-3xl lg:text-4xl font-thin text-slate-300 leading-relaxed tracking-wide max-w-3xl mx-auto">
                    <span class="word-animate" data-delay="1400">Where</span>
                    <span class="word-animate" data-delay="1550">spatial</span>
                    <span class="word-animate" data-delay="1700">optimization</span>
                    <span class="word-animate" data-delay="1850">meets</span>
                    <span class="word-animate text-sky-300 font-extralight" data-delay="2000">emergency</span>
                    <span class="word-animate text-sky-300 font-extralight" data-delay="2150">healthcare</span>
                    <span class="word-animate" data-delay="2300">and</span>
                    <span class="word-animate text-emerald-400 font-extralight" data-delay="2450">last-mile</span>
                    <span class="word-animate text-emerald-400 font-extralight" data-delay="2600">logistics.</span>
                </div>
            </h1>

            <div class="absolute -left-6 sm:-left-12 top-1/2 transform -translate-y-1/2 w-4 sm:w-8 h-px bg-indigo-400 opacity-0" style="animation: word-appear 1s ease-out forwards; animation-delay: 3.0s;"></div>
            <div class="absolute -right-6 sm:-right-12 top-1/2 transform -translate-y-1/2 w-4 sm:w-8 h-px bg-sky-400 opacity-0" style="animation: word-appear 1s ease-out forwards; animation-delay: 3.2s;"></div>
        </div>

        <!-- Action Call to Action Button & Footer -->
        <div class="text-center w-full max-w-xl">
            <div class="mb-6 w-16 sm:w-24 h-px bg-gradient-to-r from-transparent via-slate-400 to-transparent opacity-30 mx-auto"></div>
            
            <div class="opacity-0 mb-6" style="animation: word-appear 1s ease-out forwards; animation-delay: 3.4s;">
                <a 
                    href="/app" 
                    class="inline-flex items-center gap-3 px-8 py-3.5 rounded-full bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-400/40 text-slate-100 font-mono text-xs uppercase tracking-widest transition-all duration-300 shadow-lg shadow-indigo-500/20 backdrop-blur-md hover:scale-105 active:scale-95"
                >
                    <span>Launch AUSPI Workspace</span>
                    <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </a>
            </div>

            <h2 class="text-xs sm:text-sm font-mono font-light text-slate-400 uppercase tracking-[0.2em] opacity-80">
                <span class="word-animate" data-delay="3600">Analyze.</span>
                <span class="word-animate" data-delay="3800">Optimize.</span>
                <span class="word-animate" data-delay="4000">Deploy.</span>
            </h2>

            <div class="mt-4 flex justify-center space-x-3 opacity-0" style="animation: word-appear 1s ease-out forwards; animation-delay: 4.4s;">
                <div class="w-1.5 h-1.5 bg-rose-400 rounded-full opacity-60" title="Healthcare Deserts"></div>
                <div class="w-1.5 h-1.5 bg-sky-400 rounded-full opacity-80" title="Spatial Core"></div>
                <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full opacity-60" title="Logistics Dark Stores"></div>
            </div>
        </div>

    </div>

    <!-- Native JavaScript Interactions -->
    <script>
        // Word appearance animations
        document.addEventListener('DOMContentLoaded', () => {
            const wordElements = document.querySelectorAll('.word-animate');
            wordElements.forEach(word => {
                const delay = parseInt(word.getAttribute('data-delay')) || 0;
                setTimeout(() => {
                    if (word) word.style.animation = 'word-appear 0.8s ease-out forwards';
                }, delay + 300);
            });
        });

        // Mouse follow ambient gradient
        const mouseGrad = document.getElementById('mouse-gradient-auspi');
        document.addEventListener('mousemove', (e) => {
            mouseGrad.style.left = e.clientX + 'px';
            mouseGrad.style.top = e.clientY + 'px';
            mouseGrad.style.opacity = '1';
        });

        document.addEventListener('mouseleave', () => {
            mouseGrad.style.opacity = '0';
        });

        // Click ripple effect
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        });
    </script>
</body>
</html>
